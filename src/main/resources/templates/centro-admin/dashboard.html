<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{centro-admin/fragments/layout :: head('Dashboard')}"
  ></head>
  <body>
    <div class="admin-shell">
      <div
        th:replace="~{centro-admin/fragments/layout :: sidebar('dashboard')}"
      ></div>

      <main class="admin-content">
        <div class="hero animate-in">
          <div class="hero__left">
            <nav class="breadcrumb">
              <a th:href="@{/centro-admin/dashboard}">Admin de Centro</a>
              <span class="breadcrumb__sep">/</span>
              <span>Dashboard</span>
            </nav>
            <h1 class="hero__title">Panel de <em>Centro</em></h1>
            <p
              class="hero__body"
              th:if="${centros != null and !centros.isEmpty()}"
            >
              Gestionas
              <strong th:text="${stats.numCentros}">1</strong>
              centro(s):
              <span
                th:each="c, iter : ${centros}"
                th:text="${c.nombre} + (${iter.last} ? '' : ', ')"
              ></span>
            </p>
          </div>
          <div class="hero__right">
            <p class="hero__body">
              Panel de gestión de tu centro educativo. Administra grupos,
              imparticiones, alumnos y usuarios dentro de tu ámbito.
            </p>
          </div>
        </div>

        <div class="stat-grid animate-in">
          <div class="stat-card">
            <span class="stat-card__num" th:text="${stats.numCentros}">0</span>
            <span class="stat-card__label">Centros asignados</span>
          </div>
          <div class="stat-card">
            <span class="stat-card__num" th:text="${stats.numGrupos}">0</span>
            <span class="stat-card__label">Grupos</span>
          </div>
          <div class="stat-card">
            <span class="stat-card__num" th:text="${stats.numImparticiones}"
              >0</span
            >
            <span class="stat-card__label">Imparticiones</span>
          </div>
          <div class="stat-card">
            <span class="stat-card__num" th:text="${stats.numAlumnos}">0</span>
            <span class="stat-card__label">Alumnos activos</span>
          </div>
        </div>
      </main>
    </div>
    <div th:replace="~{centro-admin/fragments/layout :: colophon}"></div>
  </body>
</html>
